# Compila y publica una versión nueva cuando se sube una etiqueta v* (por ejemplo v0.7.0).
# 1. Comprueba que la etiqueta coincide con core/version.py
# 2. Pasa las pruebas
# 3. Genera el .exe (PyInstaller) y el instalador (Inno Setup)
# 4. Crea la versión en GitHub con el instalador y su SHA-256
# Las apps instaladas la detectan al arrancar y se actualizan solas.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = python -c "from core.version import VERSION; print(VERSION)"
          echo "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con core/version.py ($v)"; exit 1
          }

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Compilar el programa
        run: python -m PyInstaller --noconfirm --clean SimuladorConan.spec

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.version.outputs.version }}" instalador\SimuladorConan.iss
          $f = "salida\SimuladorConan-Setup-${{ steps.version.outputs.version }}.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "$f.sha256"

      - name: Publicar en GitHub
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notas = if (Test-Path "notas\$v.md") { "notas\$v.md" } else { $null }
          if ($notas) {
            gh release create "v$v" "salida\SimuladorConan-Setup-$v.exe" "salida\SimuladorConan-Setup-$v.exe.sha256" --title "Versión $v" --notes-file $notas
          } else {
            gh release create "v$v" "salida\SimuladorConan-Setup-$v.exe" "salida\SimuladorConan-Setup-$v.exe.sha256" --title "Versión $v" --generate-notes
          }

      - name: Guardar el instalador (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: salida/*
