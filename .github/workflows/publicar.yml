# Compila y publica una versión nueva cada vez que llega a main un cambio con un número de
# versión (core/version.py) que todavía no está publicado. También se puede lanzar a mano
# desde la pestaña Actions («Run workflow»).
# 1. Mira si la versión ya existe; si existe, solo pasa las pruebas
# 2. Pasa las pruebas
# 3. Genera el .exe (PyInstaller) y el instalador (Inno Setup)
# 4. Crea la versión en GitHub con el instalador y su SHA-256
# Las apps instaladas la detectan al arrancar y se actualizan solas.
name: Publicar versión

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la versión y ver si ya está publicada
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from core.version import VERSION; print(VERSION)"
          echo "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "nueva=false" >> $env:GITHUB_OUTPUT
            echo "La versión $v ya está publicada: solo se pasan las pruebas."
          } else {
            echo "nueva=true" >> $env:GITHUB_OUTPUT
            echo "Versión nueva: $v"
          }
          $global:LASTEXITCODE = 0

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Compilar el programa
        if: steps.version.outputs.nueva == 'true'
        run: python -m PyInstaller --noconfirm --clean SimuladorConan.spec

      - name: Instalar Inno Setup
        if: steps.version.outputs.nueva == 'true'
        run: choco install innosetup -y --no-progress

      - name: Compilar el instalador
        if: steps.version.outputs.nueva == 'true'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.version.outputs.version }}" instalador\SimuladorConan.iss
          $f = "salida\SimuladorConan-Setup-${{ steps.version.outputs.version }}.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "$f.sha256"

      - name: Publicar en GitHub
        if: steps.version.outputs.nueva == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notas = if (Test-Path "notas\$v.md") { "notas\$v.md" } else { $null }
          if ($notas) {
            gh release create "v$v" "salida\SimuladorConan-Setup-$v.exe" "salida\SimuladorConan-Setup-$v.exe.sha256" --target "${{ github.sha }}" --title "Versión $v" --notes-file $notas
          } else {
            gh release create "v$v" "salida\SimuladorConan-Setup-$v.exe" "salida\SimuladorConan-Setup-$v.exe.sha256" --target "${{ github.sha }}" --title "Versión $v" --generate-notes
          }
